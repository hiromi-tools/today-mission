<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>今日のミッション</title>
<meta name="description" content="今日やることと、残り時間が一目でわかるタスク管理アプリ">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3A4A6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今日のミッション">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <!-- ============ 今日の画面 ============ -->
  <div id="todayView">
    <header class="app-header">
      <div class="date" id="dateLabel">-</div>
      <button class="icon-btn" id="openSettingsBtn" aria-label="固定タスク設定を開く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </header>

    <section class="hero">
      <div class="hero-row">
        <div class="hero-stat">
          <div class="label">残り</div>
          <div class="value"><span id="statRemainingCount">0</span><span class="unit">件</span></div>
        </div>
        <div class="hero-stat accent">
          <div class="label">残り予定時間</div>
          <div class="value" id="statRemainingTime">0分</div>
        </div>
      </div>
      <div class="hero-progress">
        <div class="track"><div class="fill" id="progressFill" style="width:0%"></div></div>
        <div class="caption"><span id="statDoneCount">0</span> / <span id="statTotalCount">0</span> 件 完了</div>
      </div>
    </section>

    <div class="cat-scroll" id="catBreakdown"></div>

    <div class="section-label">今日のタスク <span class="count" id="pendingCountLabel"></span></div>
    <div class="task-list" id="pendingList"></div>
    <div id="pendingEmpty" class="empty-state" style="display:none;">今日のタスクはすべて終わりました。<br>右下の + から明日の分を追加できます。</div>

    <div class="section-label" id="doneSectionLabel" style="display:none;">今日できたこと <span class="count" id="doneCountLabel"></span></div>
    <div class="task-list" id="doneList"></div>

    <div class="spacer-bottom"></div>
  </div>

  <button class="fab" id="addTaskFab" aria-label="タスクを追加">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
  </button>

  <!-- ============ 固定タスク設定画面 ============ -->
  <div class="screen" id="settingsScreen">
    <div class="screen-header">
      <button class="icon-btn" id="closeSettingsBtn" aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <h1>固定タスク設定</h1>
    </div>
    <div class="screen-body" id="recurringList"></div>
    <button class="fab" id="addRecurringFab" aria-label="固定タスクを追加">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>

</div>

<!-- ============ overlay ============ -->
<div class="overlay" id="overlay"></div>

<!-- ============ タスク追加シート ============ -->
<div class="sheet" id="taskSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header" id="taskSheetTitle">タスクを追加</div>
  <div class="sheet-body">
    <div class="field">
      <label for="taskNameInput">タスク名</label>
      <input type="text" id="taskNameInput" placeholder="例）洗濯物をたたむ" maxlength="40">
    </div>
    <div class="field">
      <label>カテゴリ</label>
      <div class="chip-row" id="taskCategoryChips"></div>
    </div>
    <div class="field">
      <label>所要時間</label>
      <div class="chip-row" id="taskDurationChips"></div>
      <div class="duration-custom">
        <input type="number" id="taskDurationCustom" min="1" max="600" placeholder="自由入力">
        <span>分</span>
      </div>
    </div>
    <button class="primary-btn" id="taskSaveBtn">追加する</button>
    <button class="text-btn" id="taskCancelBtn">キャンセル</button>
  </div>
</div>

<!-- ============ 固定タスク追加/編集シート ============ -->
<div class="sheet" id="recurringSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header" id="recurringSheetTitle">固定タスクを追加</div>
  <div class="sheet-body">
    <div class="field">
      <label for="recurringNameInput">タスク名</label>
      <input type="text" id="recurringNameInput" placeholder="例）ゴミ出し" maxlength="40">
    </div>
    <div class="field">
      <label>カテゴリ</label>
      <div class="chip-row" id="recurringCategoryChips"></div>
    </div>
    <div class="field">
      <label>所要時間</label>
      <div class="chip-row" id="recurringDurationChips"></div>
      <div class="duration-custom">
        <input type="number" id="recurringDurationCustom" min="1" max="600" placeholder="自由入力">
        <span>分</span>
      </div>
    </div>
    <div class="field">
      <label>曜日</label>
      <div class="chip-row" style="margin-bottom:8px;">
        <button type="button" class="chip-btn" id="everydayToggle">毎日</button>
      </div>
      <div class="day-grid" id="dayGrid"></div>
    </div>
    <button class="primary-btn" id="recurringSaveBtn">保存する</button>
    <button class="text-btn danger-btn" id="recurringDeleteBtn" style="display:none;">この固定タスクを削除</button>
    <button class="text-btn" id="recurringCancelBtn">キャンセル</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
